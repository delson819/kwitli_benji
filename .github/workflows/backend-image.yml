name: Backend CI and GHCR image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://kwitli_ci:ci-only-password@127.0.0.1:55432/kwitli_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.3
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Start isolated PostgreSQL for tests
        run: |
          docker run --rm --detach \
            --name kwitli-ci-postgres \
            --network host \
            --env POSTGRES_DB=kwitli_test \
            --env POSTGRES_USER=kwitli_ci \
            --env POSTGRES_PASSWORD=ci-only-password \
            postgres:18.3 \
            -c listen_addresses=127.0.0.1 -p 55432
          for attempt in $(seq 1 30); do
            if docker exec kwitli-ci-postgres pg_isready -h 127.0.0.1 -p 55432 -U kwitli_ci -d kwitli_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs kwitli-ci-postgres
          exit 1

      - name: Apply migrations to the disposable CI database
        run: ALEMBIC_DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head

      - name: Run backend suite
        run: python -m pytest backend/tests -q

      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop kwitli-ci-postgres || true

  publish-multiarch:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kwitli-api
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU for ARM64 build
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to GHCR with repository-scoped GITHUB_TOKEN
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published SHA tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner_type="$(gh api "/users/$GITHUB_REPOSITORY_OWNER" --jq .type)"
          case "$owner_type" in
            User) package_endpoint="/users/$GITHUB_REPOSITORY_OWNER/packages/container/kwitli-api/versions" ;;
            Organization) package_endpoint="/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/kwitli-api/versions" ;;
            *) echo "Unsupported GitHub package owner type" >&2; exit 1 ;;
          esac

          tags_file="$RUNNER_TEMP/kwitli-ghcr-tags.txt"
          error_file="$RUNNER_TEMP/kwitli-ghcr-api-error.txt"
          if gh api --paginate --jq '.[].metadata.container.tags[]?' "$package_endpoint" >"$tags_file" 2>"$error_file"; then
            if grep -Fqx "$IMAGE_TAG" "$tags_file"; then
              echo "Refusing to overwrite existing image tag $IMAGE_TAG" >&2
              exit 1
            fi
          elif grep -q 'HTTP 404' "$error_file"; then
            echo "GHCR package does not exist yet; first publication is allowed."
          else
            cat "$error_file" >&2
            exit 1
          fi

      - name: Build and publish AMD64 and ARM64 under the commit-SHA tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Report immutable multiarchitecture digest
        run: echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
