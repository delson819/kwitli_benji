services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: ${KWITLI_POSTGRES_DB:?Set KWITLI_POSTGRES_DB}
      POSTGRES_USER: ${KWITLI_POSTGRES_USER:?Set KWITLI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KWITLI_POSTGRES_PASSWORD:?Set KWITLI_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kwitli_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: kwitli-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      ALEMBIC_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kwitli_uploads:/app/backend/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kwitli_postgres_data:
  kwitli_uploads:
